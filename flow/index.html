<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Today's books — Bean</title>
    <script type="module" crossorigin src="/bean/assets/flow-VedxApWc.js"></script>
    <link rel="modulepreload" crossorigin href="/bean/assets/sitenav-D1JaDdUR.js">
    <link rel="stylesheet" crossorigin href="/bean/assets/sitenav-DPCUVwa5.css">
    <link rel="stylesheet" crossorigin href="/bean/assets/flow-BQGURetr.css">
  </head>
  <body class="flow-page">
    <div class="flow">
      <header class="flow__top">
        <div class="flow__brand">
          <img src="/bean/assets/bean-avatar-BMPmi9zJ.png" alt="" />
          <span><b>Today's books</b> · Monday, November 9</span>
        </div>
        <ol class="steps" aria-label="Steps">
          <li><button type="button" data-step="send"><span>Send your page</span><i></i></button></li>
          <li><button type="button" data-step="check"><span>Check what Bean read</span><i></i></button></li>
          <li><button type="button" data-step="books"><span>Your books</span><i></i></button></li>
          <li><button type="button" data-step="agent"><span>Ask Bean</span><i></i></button></li>
          <li><button type="button" data-step="text"><span>Text Bean</span><i></i></button></li>
        </ol>
      </header>

      <main class="stage" id="stage" aria-label="Today's books, playing">
        <div class="flow__bottom">
          <p class="caption" id="caption" aria-live="polite"><b id="cap-title"></b><span id="cap-text"></span></p>
          <div class="controls">
            <button class="ctrl" id="pause" type="button" aria-label="Pause">
              <svg viewBox="0 0 20 20" aria-hidden="true" class="i-pause"><path d="M7 5v10M13 5v10"/></svg>
              <svg viewBox="0 0 20 20" aria-hidden="true" class="i-play"><path d="M7 4.8v10.4L15.5 10Z"/></svg>
            </button>
            <button class="ctrl" id="replay" type="button" aria-label="Play from the start">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 10a5.5 5.5 0 1 0 1.6-3.9"/><path d="M4.5 3.8v3h3"/></svg>
            </button>
          </div>
        </div>
        <div class="tables" id="tables" hidden aria-label="Your four books for Monday"><div class="tables__grid" id="tables-grid"></div></div>
      </main>
    </div>
  </body>
</html>
