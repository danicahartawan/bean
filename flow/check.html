<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Check what Bean read — Bean</title>
    <link rel="stylesheet" crossorigin href="/bean/assets/flowCheck-DIvxxdhy.css">
    <link rel="stylesheet" crossorigin href="/bean/assets/flow-rnvo6-lK.css">
  </head>
  <body class="check-page">
    <main class="check">
      <figure class="check__photo">
        <img src="/bean/assets/camera-last-CvZdcDN9.jpg" alt="Your handwritten evening collection slip" />
        <figcaption>Your evening slip</figcaption>
      </figure>

      <section class="check__read" aria-labelledby="read-title">
        <h1 id="read-title">Here’s what Bean read</h1>
        <ul class="reads" id="reads"></ul>
        <div class="check__total">
          <span>Evening total</span>
          <strong id="evening-total"></strong>
        </div>
        <p class="check__day" id="day-total"></p>
      </section>
    </main>
    <script src="./check.js"></script>
  </body>
</html>
