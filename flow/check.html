<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Check what Bean read — Bean</title>
    <link rel="stylesheet" href="./flow.css" />
    <link rel="stylesheet" href="./check.css" />
  </head>
  <body class="check-page">
    <main class="check">
      <figure class="check__photo">
        <div class="cphone" id="cphone">
          <span class="cphone__btn cphone__btn--action" aria-hidden="true"></span>
          <span class="cphone__btn cphone__btn--up" aria-hidden="true"></span>
          <span class="cphone__btn cphone__btn--down" aria-hidden="true"></span>
          <span class="cphone__btn cphone__btn--power" aria-hidden="true"></span>
          <div class="cphone__screen"><img src="../assets/camera-last.jpg" alt="Your handwritten evening collection slip, on your phone" /></div>
        </div>
      </figure>

      <section class="check__read" aria-labelledby="read-title">
        <h1 id="read-title">Here’s what Bean read</h1>
        <ul class="reads" id="reads"></ul>
        <div class="check__total">
          <span>Evening total</span>
          <strong id="evening-total"></strong>
        </div>
        <p class="check__day" id="day-total"></p>
      </section>
    </main>
    <script src="./check.js"></script>
  </body>
</html>
